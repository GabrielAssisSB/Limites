<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>GeoGebra - Limites</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.geogebra.org/apps/deployggb.js"></script>
  <script src="Limitebasico.js"></script>
  <script src="Linear.js"></script>
  <script src="Racional.js"></script>
</head>

<body>

  <div id="atividadeBox">
    <select id="atividadeSelect">
      <option value="Limitebasico">Limite básico</option>
      <option value="Linear">Função linear</option>
      <option value="Racional">Função racional</option>
    </select>
    <button id="carregarAtividade">Carregar atividade</button>
  </div>

  <div id="limiteBox">
    <div id="controleX">
      <button id="menosX">▼</button>
      <input id="limiteInput" type="text" placeholder="x tende a...">
      <button id="maisX">▲</button>
    </div>
    <div id="epsilonBox">
      <label>Aproximação:</label>
      <input id="epsilonSlider" type="range" min="0.001" max="1" step="0.001" value="0.1">
      <span id="epsilonValor">0.1</span>
    </div>
    <button id="btnLimite">Existe limite nesse ponto?</button>
  </div>

  <div id="continuidadeBox">
    <button id="btnContinuidade">Existe continuidade nesse ponto?</button>
  </div>

  <details id="aproximacaoBox">
    <summary>Aproximação</summary>
    <div class="lado">
      <h4 class="titulo-esquerda">← Esquerda</h4>
      <table id="tabelaEsquerda"></table>
    </div>
    <div class="lado">
      <h4 class="titulo-direita">Direita →</h4>
      <table id="tabelaDireita"></table>
    </div>
  </details>

  <div id="ggb-element"></div>

  <script src="objeto.js"></script>
</body>

</html>
