<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="
        width=device-width,
        initial-scale=1,
        maximum-scale=1,
        user-scalable=no">

  <title>GeoGebra - Limites</title>

  <link rel="stylesheet"
        href="style.css">

  <script src="https://www.geogebra.org/apps/deployggb.js"></script>

  <!-- ATIVIDADES -->
  <script src="Limitebasico.js"></script>
  <script src="Linear.js"></script>
  <script src="Racional.js"></script>

</head>

<body>

  <!-- =========================
       ATIVIDADES
  ========================== -->
  <div id="atividadeBox">

    <select id="atividadeSelect">

      <option value="Limitebasico">
        Limite básico
      </option>

      <option value="Linear">
        Função linear
      </option>

      <option value="Racional">
        Função racional
      </option>

    </select>

    <button id="carregarAtividade">
      Carregar atividade
    </button>

  </div>

  <!-- =========================
       LIMITE
  ========================== -->
  <div id="limiteBox">

    <div id="controleX">

      <button id="menosX">
        ▼
      </button>

      <input id="limiteInput"
             type="text"
             placeholder="x tende a...">

      <button id="maisX">
        ▲
      </button>

    </div>

    <button id="btnLimite">
      Existe limite nesse ponto?
    </button>

  </div>

  <!-- =========================
       CONTINUIDADE
  ========================== -->
  <div id="continuidadeBox">

    <button id="btnContinuidade">
      Existe continuidade nesse ponto?
    </button>

  </div>

  <!-- =========================
       APROXIMAÇÃO
  ========================== -->
  <details id="aproximacaoBox">

    <summary>
      Aproximação
    </summary>

    <div class="lado">

      <h4>Esquerda</h4>

      <table id="tabelaEsquerda"></table>

    </div>

    <div class="lado">

      <h4>Direita</h4>

      <table id="tabelaDireita"></table>

    </div>

  </details>

  <!-- =========================
       GEOGEBRA
  ========================== -->
  <div id="ggb-element"></div>

  <script src="objeto.js"></script>

</body>
</html>
